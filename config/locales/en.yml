en:
  redmine_plugin_update_add: "Add plugin"
  redmine_plugin_update_url: "Git URL"
  redmine_plugin_update_add_help: "Enter the repository URL. The folder name is taken from the URL. If cloning fails, or the repository has no init.rb, the folder is deleted and the error is written to the log."
  redmine_plugin_update_pull: "Update"
  redmine_plugin_update_remove: "Remove"
  redmine_plugin_update_confirm_add: "Clone this repository into the plugins directory and restart Redmine?"
  redmine_plugin_update_confirm_pull: "Update this plugin from its git repository and restart Redmine?"
  redmine_plugin_update_confirm_remove: "Remove this plugin and restart Redmine?"
  redmine_plugin_update_restart_command: "Restart command"
  redmine_plugin_update_restart_help: "This command runs inside the container. Example: docker restart redmine-redmine-1. If docker is missing, the new code is booted first. A failed boot does not restart Redmine and the file change is reverted. A successful boot stops the process. The service needs restart: unless-stopped so the container comes back."
  redmine_plugin_update_pulled: "Plugin updated. Redmine is restarting."
  redmine_plugin_update_installed: "Plugin added. Redmine is restarting."
  redmine_plugin_update_removed: "Plugin removed. Redmine is restarting."
  redmine_plugin_update_manual_restart: "The file change is done. Restart the Redmine container on the server."
  redmine_plugin_update_boot_failed: "The boot test failed, so Redmine was not restarted. The file change was reverted. See log/redmine_plugin_update.log."
  redmine_plugin_update_restarting: "Redmine is restarting. Refresh the page in about 30 seconds."
  redmine_plugin_update_failed: "The operation failed and was rolled back. See log/redmine_plugin_update.log."
  redmine_plugin_update_no_git: "The git command is not available inside the container. Nothing was updated."
  redmine_plugin_update_permission: "The container user cannot write this plugin directory. Nothing was updated."
  redmine_plugin_update_no_init: "The repository has no init.rb. The downloaded folder was removed."
  redmine_plugin_update_duplicate: "This plugin is already installed. The downloaded folder was removed."
  redmine_plugin_update_reverted: "Restart failed. The file change was rolled back. See log/redmine_plugin_update.log."
  redmine_plugin_update_not_git: "This plugin is not a git checkout, so it cannot be updated from here."
  redmine_plugin_update_dirty: "This plugin has local changes. It was not updated."
  redmine_plugin_update_invalid_url: "Enter an https or git SSH URL."
  redmine_plugin_update_exists: "A plugin folder with this name already exists."
  redmine_plugin_update_not_found: "Plugin not found."
